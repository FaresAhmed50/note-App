<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Notes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="A premium note taking experience">
  <meta name="theme-color" content="#1e1e2e">
</head>

<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="logo-icon">
          <path fill-rule="evenodd" d="M5.625 1.5H9a3.75 3.75 0 013.75 3.75v1.875c0 1.036.84 1.875 1.875 1.875H16.5a3.75 3.75 0 013.75 3.75v7.875c0 1.035-.84 1.875-1.875 1.875H5.625a1.875 1.875 0 01-1.875-1.875V3.375c0-1.036.84-1.875 1.875-1.875zm5.845 17.03a.75.75 0 001.06 0l3-3a.75.75 0 10-1.06-1.06l-1.72 1.72V12a.75.75 0 00-1.5 0v4.19l-1.72-1.72a.75.75 0 00-1.06 1.06l3 3z" clip-rule="evenodd" />
          <path d="M14.25 5.25a5.23 5.23 0 00-1.279-3.434 9.768 9.768 0 016.963 6.963A5.23 5.23 0 0016.5 7.5h-1.875a.375.375 0 01-.375-.375V5.25z" />
        </svg>
        <h1>Deep Notes</h1>
      </div>
      <button id="open-create-modal" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon-sm">
          <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
        </svg>
        New Note
      </button>
    </header>

    <!-- Main Content -->
    <main>
      <div id="notes-grid" class="notes-grid">
        <!-- Notes will be injected here by JS -->
        <!-- Example Placeholder for styling -->
        <!--
        <div class="note-card">
          <h3 class="note-title">Meeting Notes</h3>
          <p class="note-content">Lorem ipsum dolor sit amet...</p>
          <div class="note-footer">
            <span class="note-date">May 18, 2023</span>
            <div class="note-actions">
              <button class="btn-icon edit-btn"><svg>...</svg></button>
              <button class="btn-icon delete-btn"><svg>...</svg></button>
            </div>
          </div>
        </div>
        -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-illustration">📝</div>
        <h2>No notes yet</h2>
        <p>Create your first note to get started.</p>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Loading your ideas...</p>
      </div>
    </main>
  </div>

  <!-- Create Note Modal -->
  <div id="create-modal" class="modal-overlay hidden">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h2>Create New Note</h2>
        <button class="close-modal">&times;</button>
      </div>
      <form id="create-note-form">
        <div class="form-group">
          <label for="create-title">Title</label>
          <input type="text" id="create-title" name="title" placeholder="Enter note title..." required>
        </div>
        <div class="form-group">
          <label for="create-content">Content</label>
          <textarea id="create-content" name="content" rows="6" placeholder="Write your thoughts here..." required></textarea>
        </div>
        <div class="form-group">
          <label for="create-content">Content</label>
          <textarea id="create-content2" name="content" rows="6" placeholder="Write your thoughts here..." required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary close-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Update Note Modal -->
  <div id="update-modal" class="modal-overlay hidden">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h2>Edit Note</h2>
        <button class="close-modal">&times;</button>
      </div>
      <form id="update-note-form">
        <input type="hidden" id="update-id" name="id">
        <div class="form-group">
          <label for="update-title">Title</label>
          <input type="text" id="update-title" name="title" required>
        </div>
        <div class="form-group">
          <label for="update-content">Content</label>
          <textarea id="update-content" name="content" rows="6" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary close-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Update Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-content glass-panel small-modal">
      <div class="modal-header">
        <h2>Delete Note?</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this note? This action cannot be undone.</p>
        <p class="note-preview-text" id="delete-note-title"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary close-modal-btn">Cancel</button>
        <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/apiCalling.js"></script>
  <script type="module" src="js/app.js"></script>

</body>

</html>
